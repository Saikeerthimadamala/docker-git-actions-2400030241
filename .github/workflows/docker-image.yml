name: Docker Fullstack

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./FARMERSCOOPERATIVE-SPRINGBOOT
          file: ./FARMERSCOOPERATIVE-SPRINGBOOT/backend.Dockerfile
          push: true
          tags: saikeerthimadamala28/docker-backend-2400030241:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./FARMERSCOOPERATIVE-REACT
          file: ./FARMERSCOOPERATIVE-REACT/frontend.Dockerfile
          push: true
          tags: saikeerthimadamala28/docker-frontend-2400030241:latest
